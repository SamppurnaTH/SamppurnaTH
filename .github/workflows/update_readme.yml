name: Update profile README

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (off the hour to avoid queue spikes)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [generate_readme.py, .github/workflows/update_readme.yml]

concurrency:
  group: profile-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PAT_TOKEN (classic, read:user + repo) lets the contribution counts include
      # private work; without it the built-in token still produces a valid README.
      - name: Generate README and SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: python generate_readme.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile README [skip ci]"
            git push
          fi
